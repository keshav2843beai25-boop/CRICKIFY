<!-- cart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Crickify</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Cart page layout fix ── */
    .cart-page {
      padding: 40px 30px;
      min-height: 80vh;
      background: var(--light);
    }

    .cart-page > h2 {
      font-family: 'Bebas Neue', cursive;
      font-size: 48px;
      letter-spacing: 3px;
      text-align: center;
      color: var(--navy);
      margin-bottom: 30px;
    }

    /* Side-by-side: items left, summary right */
    .cart-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      max-width: 1200px;
      margin: 0 auto;
    }

    .cart-items-list {
      flex: 3;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Order Summary card ── */
    .cart-summary {
      flex: 1;
      min-width: 280px;
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
      position: sticky;
      top: 90px;
    }

    .cart-summary h3 {
      font-family: 'Bebas Neue', cursive;
      font-size: 26px;
      letter-spacing: 2px;
      color: #0d1b2a;
      margin: 0 0 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid #f0f4f8;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 600;
      color: #555;
      margin-bottom: 12px;
    }

    .summary-line.total-line {
      font-size: 20px;
      font-weight: 700;
      color: #0d1b2a;
      border-top: 2px solid #f0f4f8;
      padding-top: 14px;
      margin-top: 6px;
    }

    .checkout-btn {
      width: 100%;
      padding: 15px;
      background: #0077b6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-family: 'Bebas Neue', cursive;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    .checkout-btn:hover {
      background: #00b4d8;
      transform: translateY(-2px);
    }

    /* ── Cart item card ── */
    .crickify-cart-card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      display: flex;
      gap: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      align-items: flex-start;
    }

    .crickify-cart-card img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 14px;
      flex-shrink: 0;
    }

    .cart-details { flex: 1; }

    .cart-details h2 {
      margin: 0 0 6px;
      font-size: 24px;
      color: #0d1b2a;
    }

    .cart-desc { color: #888; margin: 0 0 6px; font-size: 15px; }

    .cart-rating {
      color: #2d6a4f;
      font-weight: 600;
      margin-bottom: 14px;
      font-size: 15px;
    }
    .cart-rating span { color: #999; }

    .cart-price {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .new-price { font-size: 26px; font-weight: 700; color: #0077b6; }
    .old-price  { text-decoration: line-through; color: #aaa; font-size: 17px; }
    .discount   { color: #27ae60; font-weight: 700; font-size: 15px; }

    .qty-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .qty-section button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: #0d1b2a;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      line-height: 1;
    }
    .qty-section button:hover { background: #0077b6; }

    .qty-section span { font-size: 20px; font-weight: 700; min-width: 24px; text-align: center; }

    .cart-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .save-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: #e9ecef;
      color: #333;
      transition: 0.2s;
    }
    .save-btn:hover { background: #dee2e6; }

    .remove-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: #e63946;
      color: white;
      transition: 0.2s;
    }
    .remove-btn:hover { background: #c1121f; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      width: 100%;
    }
    .empty-icon { font-size: 80px; display: block; margin-bottom: 16px; }
    .empty-state h3 {
      font-family: 'Bebas Neue', cursive;
      font-size: 36px;
      letter-spacing: 2px;
      color: #0d1b2a;
      margin-bottom: 10px;
    }
    .empty-state p { font-size: 16px; color: #888; margin-bottom: 24px; }
    .empty-state button {
      padding: 12px 36px;
      background: #0077b6;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-family: 'Bebas Neue', cursive;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s;
    }
    .empty-state button:hover { background: #00b4d8; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .cart-layout { flex-direction: column; }
      .cart-summary { position: static; min-width: unset; width: 100%; }
      .crickify-cart-card { flex-direction: column; }
      .crickify-cart-card img { width: 100%; height: 220px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <h1 class="logo">Crickify 🏏</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
    </div>
  </nav>

  <section class="cart-page">
    <h2>Your Cart 🛒</h2>

    <!-- FLEX WRAPPER: items LEFT, summary RIGHT -->
    <div class="cart-layout">

      <!-- CART ITEMS -->
      <div id="cart-items" class="cart-items-list"></div>

      <!-- ORDER SUMMARY -->
      <div id="cart-summary" class="cart-summary">
        <h3>Order Summary</h3>

        <div class="summary-line">
          <span>Items</span>
          <span id="summary-count">0 item(s)</span>
        </div>

        <div class="summary-line">
          <span>Delivery</span>
          <span style="color:#27ae60; font-weight:700;">FREE</span>
        </div>

        <div class="summary-line">
          <span>Subtotal</span>
          <span id="summary-subtotal">₹0</span>
        </div>

        <div class="summary-line total-line">
          <span>Total</span>
          <span id="summary-total">₹0</span>
        </div>

        <button class="checkout-btn" onclick="checkoutCart()">
          Proceed To Checkout →
        </button>
      </div>

    </div>
  </section>

  <script src="cart.js"></script>

</body>
</html>
