<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Orders - Crickify</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    /* ── NAVBAR ── */
    .navbar {
      background: #0d1b2a;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0,180,216,0.15);
    }

    .logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 34px;
      color: #00b4d8;
      letter-spacing: 3px;
    }

    .nav-links { display: flex; gap: 8px; align-items: center; }

    .nav-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-links a:hover { color: #00b4d8; background: rgba(0,180,216,0.1); }

    /* ── PAGE ── */
    .orders-page {
      padding: 50px 30px 80px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-eyebrow {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #0077b6;
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 52px;
      letter-spacing: 3px;
      text-align: center;
      color: #0d1b2a;
      margin-bottom: 40px;
    }

    /* ── ORDERS LIST ── */
    #orders-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── ORDER CARD ── */
    .order-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      gap: 0;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      border: 1px solid rgba(0,0,0,0.05);
    }
    .order-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.13);
    }

    .order-card img {
      width: 180px;
      min-height: 180px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .order-info {
      padding: 24px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

    .order-name {
      font-family: 'Bebas Neue', cursive;
      font-size: 24px;
      letter-spacing: 2px;
      color: #0d1b2a;
      margin-bottom: 4px;
    }

    .order-price {
      font-size: 22px;
      font-weight: 700;
      color: #0077b6;
      white-space: nowrap;
    }

    .order-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      margin: 14px 0;
    }

    .meta-item {
      font-size: 14px;
      font-weight: 600;
      color: #666;
    }
    .meta-item strong {
      color: #0d1b2a;
      font-weight: 700;
    }

    .order-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .order-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: #d8f3dc;
      color: #2d6a4f;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .payment-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: #e7f5ff;
      color: #0077b6;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }
    .empty-icon { font-size: 80px; display: block; margin-bottom: 20px; }
    .empty-state h3 {
      font-family: 'Bebas Neue', cursive;
      font-size: 38px;
      letter-spacing: 2px;
      color: #0d1b2a;
      margin-bottom: 10px;
    }
    .empty-state p { font-size: 16px; color: #888; margin-bottom: 28px; }
    .empty-state button {
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      background: #0077b6;
      color: white;
      font-family: 'Bebas Neue', cursive;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s;
    }
    .empty-state button:hover { background: #00b4d8; transform: translateY(-2px); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .order-card { flex-direction: column; }
      .order-card img { width: 100%; height: 200px; }
      .order-top { flex-direction: column; }
      .orders-page { padding: 30px 16px 60px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <h1 class="logo">Crickify 🏏</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
    </div>
  </nav>

  <section class="orders-page">
    <p class="page-eyebrow">Your Account</p>
    <h2 class="page-title">My Orders</h2>
    <div id="orders-container"></div>
  </section>

  <script src="orders.js"></script>
</body>
</html>
