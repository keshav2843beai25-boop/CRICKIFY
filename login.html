<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Crickify</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#0d1b2a,#1b263b);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:380px;
      background:white;
      padding:35px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#0d1b2a;
    }

    .input-group{
      margin-bottom:18px;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:2px solid #ddd;
      outline:none;
      font-size:16px;
    }

    .input-group input:focus{
      border-color:#0077b6;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#0077b6;
      color:white;
      font-size:17px;
      cursor:pointer;
    }

    button:hover{
      background:#023e8a;
    }

    p{
      margin-top:18px;
      text-align:center;
    }

    a{
      color:#0077b6;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h2>Login</h2>

    <div class="input-group">
      <input type="email" id="loginEmail" placeholder="Enter Email">
    </div>

    <div class="input-group">
      <input type="password" id="loginPassword" placeholder="Enter Password">
    </div>

    <button onclick="loginUser()">
      Login
    </button>

    <p>
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </p>

  </div>

  <script src="login.js"></script>

</body>
</html>
